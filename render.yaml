services:
  - type: web
    name: probwatch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: probwatch-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://srivastavayushi.github.io

databases:
  - name: probwatch-db
    databaseName: probwatch
    user: probwatch
